version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://synkron:synkron_password_9481@postgres:5432/workforce_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-production-jwt-key-9481
      - BIOMETRIC_MODEL_KEY=prod-resnet50-model-key-9481
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: synkron
      POSTGRES_PASSWORD: synkron_password_9481
      POSTGRES_DB: workforce_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:

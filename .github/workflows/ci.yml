name: Synkron AI CI/CD Production Hardening Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Vite Build Audit
        run: npx vite build

      - name: Run Vitest Unit & Contract Suite
        run: npx vitest run server/tests/backend.test.ts

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#06090E"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A67"/>
      <stop offset="50%" stop-color="#E05A47"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Outer Orbital Sync Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#accentGrad)" stroke-width="24" stroke-dasharray="720 180" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner Interlocking Node Orbit -->
  <circle cx="256" cy="256" r="100" stroke="url(#cyanGrad)" stroke-width="16" stroke-dasharray="400 120" stroke-linecap="round" transform="rotate(-45 256 256)"/>

  <!-- Central Synkron Core Node -->
  <circle cx="256" cy="256" r="44" fill="url(#accentGrad)" filter="url(#glow)"/>
  
  <!-- Pulse Crosshair Geometry -->
  <path d="M256 120 V160 M256 352 V392 M120 256 H160 M352 256 H392" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
</svg>